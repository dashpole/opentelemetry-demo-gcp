steps:
- name: 'gcr.io/cloud-builders/gcloud'
  id: 'Get GKE Credentials'
  env:
  - 'KUBECONFIG=/workspace/kubeconfig'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    gcloud container clusters get-credentials "${_CLUSTER}" --zone="${_ZONE}" --project="${_PROJECT_ID}"
    mkdir -p /workspace/bin
    PLUGIN_PATH=$$(which gke-gcloud-auth-plugin || find / -name gke-gcloud-auth-plugin 2>/dev/null | head -n 1)
    if [ -n "$$PLUGIN_PATH" ]; then
      echo "Found plugin at $$PLUGIN_PATH, copying to /workspace/bin"
      cp "$$PLUGIN_PATH" /workspace/bin/
    else
      echo "gke-gcloud-auth-plugin not found!"
      exit 1
    fi

- name: 'golang:1.26'
  id: 'Build Verifier'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    cd internal/e2e/verifier
    CGO_ENABLED=0 go build -o verifier main.go

- name: 'ghcr.io/helmfile/helmfile:v0.165.0'
  id: 'Deploy and Verify'
  entrypoint: 'sh'
  env:
  - 'KUBECONFIG=/workspace/kubeconfig'
  - 'PROJECT_ID=${_PROJECT_ID}'
  - 'PATH=/workspace/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
  args:
  - '-c'
  - |
    NAMESPACE="otel-demo-pr-${_PR_NUMBER}"
    cleanup() {
      echo "Cleaning up namespace $${NAMESPACE}..."
      kubectl delete namespace "$${NAMESPACE}" || true
    }
    trap cleanup EXIT

    # Install make and bash (needed by deploy.sh)
    apk add make bash

    echo "Creating namespace $${NAMESPACE}..."
    kubectl create namespace "$${NAMESPACE}"

    echo "Deploying demo..."
    # deploy.sh uses relative paths, so we run it from root.
    # It will use KUBECONFIG from env.
    ./gcp/deploy.sh -N "$${NAMESPACE}" -p "${_PROJECT_ID}"

    echo "Running verifier..."
    ./internal/e2e/verifier/verifier --project="${_PROJECT_ID}" --namespace="$${NAMESPACE}" --wait=2m --timeout=5m

substitutions:
  _CLUSTER: 'opentelemetry-demo-test'
  _ZONE: 'us-central1-c'
  _PROJECT_ID: 'opentelemetry-ops-e2e'
  _PR_NUMBER: '0'

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: 'ALLOW_LOOSE'
